apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-anomaly-detector
  labels:
    app: k8s-anomaly-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-anomaly-detector
  template:
    metadata:
      labels:
        app: k8s-anomaly-detector
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anomaly-detector
          image: k8s-anomaly-detector:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: NAMESPACE_REGEX
              value: ".*"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-anomaly-detector
  labels:
    app: k8s-anomaly-detector
spec:
  selector:
    app: k8s-anomaly-detector
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
